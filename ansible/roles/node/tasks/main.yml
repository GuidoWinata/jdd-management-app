---
- name: Install prerequisite for NodeSource
  apt:
    name: gpg
    state: present

- name: Add NodeSource GPG key
  shell: |
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Add NodeSource repository (Node.js LTS)
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js (latest LTS)
  apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Install Bun via npm
  npm:
    name: bun
    global: yes
    state: present
